<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · Jellybean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="forgot-password.html">
  <header id="site-header"></header>

  <main>
    <div class="auth-shell">
      <div class="auth-card" style="max-width:460px;grid-template-columns:1fr">
        <div class="auth-main" id="forgot-card">
          <h1>Forgot password?</h1>
          <p class="auth-sub">No worries — enter your email and we'll send a reset link.</p>
          <div class="auth-msg" id="auth-msg"></div>
          <form id="forgot-form" novalidate>
            <div class="field"><label>Email</label>
              <input data-req data-email id="fp-email" type="email" placeholder="you@email.com" autocomplete="email">
              <span class="err">Enter a valid email</span>
            </div>
            <button class="btn btn--block" type="submit">Send reset link 📬</button>
          </form>
          <p class="auth-alt">Remembered it? <a href="login.html">Back to log in</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="pages.js"></script>
</body>
</html>
