<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Jellybean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login.html">
  <header id="site-header"></header>

  <main>
    <div class="auth-shell">
      <div class="auth-card">
        <aside class="auth-aside">
          <span class="spark a1">🍬</span>
          <span class="spark a2">⭐</span>
          <span class="eyebrow" style="color:#fff">Welcome back</span>
          <h2>Hello again!</h2>
          <p>Sign in to track orders, save favorites and check out faster.</p>
          <ul>
            <li>📦 Track every order</li>
            <li>💖 Keep your favorites</li>
            <li>🧾 Download invoices</li>
          </ul>
        </aside>

        <div class="auth-main">
          <h1>Log in</h1>
          <p class="auth-sub">Enter your details to continue.</p>
          <div class="auth-msg" id="auth-msg"></div>
          <form id="login-form" novalidate>
            <div class="field"><label>Email</label>
              <input data-req data-email id="li-email" type="email" placeholder="you@email.com" autocomplete="email">
              <span class="err">Enter a valid email</span>
            </div>
            <div class="field"><label>Password</label>
              <input data-req id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
              <span class="err">Required</span>
            </div>
            <div class="auth-row"><a href="forgot-password.html">Forgot password?</a></div>
            <button class="btn btn--block" type="submit">Log in →</button>
          </form>
          <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="pages.js"></script>
</body>
</html>
